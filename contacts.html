<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Rural Bank of Paete, Inc.</title>
  
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0b5394',
              cyan: '#00b4d8',
              input: '#e0f7fa'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-500 antialiased overflow-x-hidden">

  <!-- ================= HEADER ================= -->
  <header id="header-section" class="w-full bg-white dark:bg-gray-900 shadow-md sticky top-0 z-50 transition-colors duration-500">
    <!-- JavaScript will inject the header content here -->
  </header>

  <!-- ================= BANNER ================= -->
  <div class="bg-brand-dark dark:bg-blue-950 w-full py-10 text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-white">Contact Us</h1>
  </div>

  <!-- ================= CONTENT ================= -->
  <div class="max-w-7xl mx-auto px-4 py-16 flex flex-col lg:flex-row gap-12 lg:gap-20">
      <div class="lg:w-1/2">
          <form action="process.php" method="POST" class="space-y-5">
              <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 bg-brand-input dark:bg-gray-800 border border-brand-cyan rounded-md focus:ring-2 focus:ring-brand-cyan outline-none text-gray-800 dark:text-white">
              <input type="email" name="email" placeholder="Email Address" required class="w-full px-4 py-3 bg-brand-input dark:bg-gray-800 border border-brand-cyan rounded-md focus:ring-2 focus:ring-brand-cyan outline-none text-gray-800 dark:text-white">
              <input type="text" name="subject" placeholder="Subject" required class="w-full px-4 py-3 bg-brand-input dark:bg-gray-800 border border-brand-cyan rounded-md focus:ring-2 focus:ring-brand-cyan outline-none text-gray-800 dark:text-white">
              <textarea name="message" rows="6" placeholder="Message" required class="w-full px-4 py-3 bg-brand-input dark:bg-gray-800 border border-brand-cyan rounded-md focus:ring-2 focus:ring-brand-cyan outline-none resize-none text-gray-800 dark:text-white"></textarea>
              <button type="submit" class="bg-brand-cyan text-white font-medium py-3 px-8 rounded-md hover:bg-cyan-600 transition shadow-md">Send Message</button>
          </form>
      </div>

      <div id="contact-info-section" class="lg:w-1/2">
          <!-- JavaScript will inject the contact info content here -->
      </div>
  </div>

  <div class="w-full h-[400px]">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3866.4952041285265!2d121.47892901533604!3d14.364427989953335!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397e2f5b5c9284d%3A0x6a2eb2d7bb476722!2sRural%20Bank%20of%20Paete!5e0!3m2!1sen!2sph!4v1690000000000!5m2!1sen!2sph" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
  </div>

  <!-- Footer -->
  <footer id="footer-section" class="bg-blue-900 dark:bg-black text-white pt-12 pb-6 transition-colors duration-500">
    <!-- JavaScript will inject the footer content here -->
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
