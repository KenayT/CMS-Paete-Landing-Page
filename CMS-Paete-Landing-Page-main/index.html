<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rural Bank of Paete, Inc.</title>
  
  <!-- Favicon -->
  <link rel="icon" href="assets/logo.png" type="image/png" />
  
  <!-- Tailwind CSS -->
  <link href="./src/output.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-500 antialiased overflow-x-hidden">

  <!-- ================= HEADER & NAVIGATION ================= -->
  <header id="header-section" class="w-full bg-white dark:bg-gray-900 shadow-md sticky top-0 z-50 transition-colors duration-500">
  </header>

  <!-- ================= HERO SECTION ================= -->
  <section id="hero-section" class="relative w-full pt-16 pb-48 lg:pt-24 lg:pb-56 overflow-hidden bg-cover bg-center bg-no-repeat transition-colors duration-500">
  </section>

  <!-- ================= INFINITE CAROUSEL SECTION ================= -->
  <section id="carousel-section" class="relative w-full z-20 -mt-32 sm:-mt-40 mb-16">
  </section>

  <!-- ================= WHAT WE OFFER SECTION ================= -->
  <section id="offerings-section" class="relative w-full py-16 lg:py-24 bg-sky-500 dark:bg-blue-950 transition-colors duration-500 overflow-hidden">

  </section>

  <!-- ================= INFO BOXES SECTION ================= -->
  <section id="info-boxes-section" class="py-12 bg-gray-50 dark:bg-gray-900 transition-colors duration-500">
  </section>

  <!-- ================= FOOTER ================= -->
  <footer id="footer-section" class="bg-blue-900 dark:bg-black text-white pt-12 pb-6 transition-colors duration-500">
  </footer>

  <script type="module" src="app.js"></script>

</body>
</html>
